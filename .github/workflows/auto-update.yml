# .github/workflows/auto-update.yml
#
# Cron job — runs daily at 06:00 UTC.
# Downloads the latest commercetools Postman collection, regenerates source
# files, verifies the build compiles, then commits only the SOURCE changes.
#
# dist/ is intentionally never committed — it is a build artifact that must
# remain gitignored. It is produced at publish time by prepublishOnly, which
# already runs "npm run update" (generate + build) before any npm publish.
#
# Flow:
#   download → diff check → generate → BUILD VERIFY → commit sources only

name: Auto-Update from Postman Collection

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  check-and-update:
    # Prevent infinite loop: skip if this push was made by the bot itself
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download latest Postman collection
        run: |
          curl -sL \
            "https://raw.githubusercontent.com/commercetools/commercetools-postman-collection/master/api/collection.json" \
            -o collection.json
          echo "Downloaded collection at $(date -u)"

      - name: Check if collection changed
        id: check_diff
        run: |
          if git diff --quiet collection.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Collection unchanged — skipping regeneration"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔄 Collection has changed — regenerating node properties"
          fi

      - name: Generate node properties from collection
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.check_diff.outputs.changed == 'true'
        run: npm run generate

      # Verify the generated properties.ts / subscription.properties.ts still
      # compile correctly with Commercetools.node.ts and CommercetoolsTrigger.node.ts
      # before touching main. dist/ is discarded after this step — never committed.
      - name: Verify build compiles cleanly
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.check_diff.outputs.changed == 'true'
        run: |
          npm run build
          echo "✅ Build passed — generated files are safe to commit"

      - name: Show what changed
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          echo "=== Changed source files ==="
          git diff --stat -- \
            collection.json \
            'nodes/Commercetools/generated/*.json' \
            'nodes/Commercetools/generated/*.ts'
          echo ""
          echo "=== New/modified operations ==="
          git diff nodes/Commercetools/generated/operations.json \
            | grep '^\+.*"name"' | head -20 || true

      # Only commit generated SOURCE files — never dist/.
      # dist/ stays gitignored; it was only needed for the build verify above.
      - name: Commit regenerated files
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            collection.json \
            nodes/Commercetools/generated/ctp-event-registry.json \
            nodes/Commercetools/generated/operations.json \
            nodes/Commercetools/generated/properties.ts \
            nodes/Commercetools/generated/subscription.properties.ts
          if git diff --staged --quiet; then
            echo "⏭️  Nothing new to commit — skipping"
          else
            git commit -m \
              "chore: auto-update from Postman collection [$(date -u +%Y-%m-%d)]"
            git push
          fi

      # ── Optional: publish to npm ──────────────────────────────────────────
      # Uncomment and add NPM_TOKEN secret to enable automatic npm publish.
      # prepublishOnly already runs "npm run update" (generate + build),
      # so dist/ will be rebuilt fresh and included in the published package.

      # - name: Bump patch version and publish
      #   if: steps.check_diff.outputs.changed == 'true'
      #   run: |
      #     npm version patch --no-git-tag-version
      #     npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## Auto-Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Collection changed: ${{ steps.check_diff.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY